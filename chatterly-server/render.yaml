services:
  - type: web
    name: chatterly-api
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: OTP_PROVIDER
        value: firebase
      - key: FIREBASE_SERVICE_ACCOUNT_BASE64
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: chatterly-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: chatterly-redis
          property: connectionString
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        value: chatterly-media
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "false"

  - type: redis
    name: chatterly-redis
    plan: starter
    ipAllowList: []

databases:
  - name: chatterly-db
    plan: starter
